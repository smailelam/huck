<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خزانتي — ملفات وفيديوهات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap">
<style>
:root{--bg:#f2f4f1;--ink:#1b2a2f;--mute:#5d6d72;--line:#d3dad6;--acc:#0f7b6c;--accfg:#fff;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12191c;--ink:#e6eeee;--mute:#93a5a8;--line:#2a373b;--acc:#3cc2ad;--accfg:#08201c;--card:#192226}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:920px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:2.2rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
button,a.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;text-decoration:none;display:inline-block}
.p{background:var(--acc)!important;color:var(--accfg)!important;border-color:var(--acc)!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.bar input{flex:1;min-width:160px;font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:6px}.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#info{color:var(--mute);font-size:.92rem;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pv{height:140px;background:color-mix(in srgb,var(--ink) 7%,var(--card));display:flex;align-items:center;justify-content:center;overflow:hidden}
.pv img,.pv video{width:100%;height:100%;object-fit:cover}.pv b{font-size:1.5rem;color:var(--mute);direction:ltr}
.meta{padding:10px 12px 6px;flex:1}.nm{font-weight:500;word-break:break-word;direction:auto}.sz{color:var(--mute);font-size:.85rem}
.act{display:flex;gap:6px;padding:8px 12px 12px}
.empty{grid-column:1/-1;color:var(--mute);padding:30px 0;line-height:2}
.empty code{background:var(--card);border:1px solid var(--line);padding:1px 6px;border-radius:4px;direction:ltr;display:inline-block}
dialog{border:0;border-radius:14px;padding:0;max-width:min(960px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}dialog video,dialog img{display:block;max-width:100%;max-height:78vh;margin:auto}
dialog header{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;align-items:center}
</style>
</head>
<body>
<main>
  <h1>خزانتي</h1>
  <p class="sub">ملفاتك وفيديوهاتك محفوظة في المستودع، فتظهر لك في أي متصفح وأي جهاز.</p>
  <a class="btn p" id="add" target="_blank" rel="noopener">إضافة ملفات</a>
  <div class="bar">
    <input id="q" type="search" placeholder="ابحث باسم الملف" aria-label="بحث">
    <div class="tabs" role="group" aria-label="تصفية">
      <button data-f="all" aria-pressed="true">الكل</button>
      <button data-f="video" aria-pressed="false">فيديو</button>
      <button data-f="image" aria-pressed="false">صور</button>
      <button data-f="other" aria-pressed="false">ملفات</button>
    </div>
  </div>
  <div id="info" aria-live="polite">جارٍ التحميل…</div>
  <div id="grid"></div>
</main>
<dialog id="dlg"><header><strong id="dt"></strong><button id="dc">إغلاق</button></header><div id="db"></div></dialog>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var owner=location.hostname.split('.')[0],repo=location.pathname.split('/')[1]||'';
  var API='https://api.github.com/repos/'+owner+'/'+repo,DIR='files';
  var all=[],filter='all',query='';
  var V=/\.(mp4|webm|mov|m4v|ogv)$/i,I=/\.(png|jpe?g|gif|webp|svg|avif)$/i;
  function kind(n){return V.test(n)?'video':I.test(n)?'image':'other'}
  function size(n){var u=['بايت','ك.ب','م.ب','ج.ب'],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
  function url(n){return DIR+'/'+encodeURIComponent(n)}
  function setEmpty(html){$('#grid').innerHTML='<div class="empty">'+html+'</div>';$('#info').textContent=''}

  async function load(){
    try{
      var r=await fetch(API+'/contents/'+DIR);
      if(r.status==404){setEmpty('لا يوجد مجلد <code>files</code> في المستودع بعد.<br>في GitHub اختر Add file ثم Create new file، واكتب في الاسم <code>files/.gitkeep</code> ثم Commit. بعدها اضغط «إضافة ملفات» وارفع ملفاتك.');return}
      if(r.status==403){setEmpty('تجاوز GitHub حد الطلبات مؤقتًا. أعد المحاولة بعد قليل.');return}
      if(!r.ok)throw 0;
      all=(await r.json()).filter(function(x){return x.type=='file'&&x.name[0]!='.'});
      render();
    }catch(e){setEmpty('تعذّر تحميل القائمة. تأكد أن المستودع عام (Public) وأنك متصل بالإنترنت.')}
  }
  fetch(API).then(function(r){return r.json()}).then(function(j){
    $('#add').href='https://github.com/'+owner+'/'+repo+'/upload/'+(j.default_branch||'main')+'/'+DIR}).catch(function(){
    $('#add').href='https://github.com/'+owner+'/'+repo});

  function render(){
    var tot=all.reduce(function(a,x){return a+x.size},0);
    var list=all.filter(function(x){return (filter=='all'||kind(x.name)==filter)&&x.name.toLowerCase().indexOf(query)>-1});
    $('#info').textContent=all.length?all.length+' ملف — '+size(tot):'';
    var g=$('#grid');g.textContent='';
    if(!list.length){setEmpty(all.length?'لا توجد نتائج مطابقة.':'المجلد فارغ. اضغط «إضافة ملفات» لرفع أول ملف.');$('#info').textContent=all.length?$('#info').textContent:'';return}
    list.forEach(function(x){
      var k=kind(x.name),u=url(x.name),d=document.createElement('div');d.className='it';
      var pv=document.createElement('div');pv.className='pv';
      if(k=='image'){var im=new Image();im.loading='lazy';im.src=u;im.alt='';pv.appendChild(im)}
      else if(k=='video'){var v=document.createElement('video');v.src=u+'#t=0.5';v.preload='metadata';v.muted=true;pv.appendChild(v)}
      else{pv.innerHTML='<b></b>';pv.firstChild.textContent=(/\.([^.]+)$/.exec(x.name)||[0,'FILE'])[1].slice(0,4).toUpperCase()}
      var m=document.createElement('div');m.className='meta';
      var n=document.createElement('div');n.className='nm';n.textContent=x.name;
      var z=document.createElement('div');z.className='sz';z.textContent=size(x.size);
      m.append(n,z);
      var a=document.createElement('div');a.className='act';
      var o=document.createElement('a');o.className='btn p';o.target='_blank';o.rel='noopener';o.href=u;o.textContent=k=='other'?'فتح':'عرض';
      if(k!='other'){o.removeAttribute('target');o.onclick=function(e){e.preventDefault();show(x.name,u,k)}}
      var dl=document.createElement('a');dl.className='btn';dl.href=u;dl.download=x.name;dl.textContent='تحميل';
      a.append(o,dl);d.append(pv,m,a);g.appendChild(d);
    });
  }
  function show(name,u,k){
    $('#dt').textContent=name;var b=$('#db');b.textContent='';
    var e=k=='video'?document.createElement('video'):new Image();e.src=u;
    if(k=='video'){e.controls=true;e.autoplay=true}else e.alt=name;
    b.appendChild(e);$('#dlg').showModal();
  }
  $('#dc').onclick=function(){$('#dlg').close()};
  $('#dlg').addEventListener('close',function(){var v=$('#db video');if(v)v.pause()});
  $('#q').oninput=function(e){query=e.target.value.toLowerCase();render()};
  document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
    filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render()}});
  load();
})();
</script>
</body>
</html>
